<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XHR Capture</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; font-size: 12px; background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  #toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #252526; border-bottom: 1px solid #3c3c3c; flex-shrink: 0; flex-wrap: wrap; }
  #toolbar button { padding: 4px 10px; border: 1px solid #555; background: #3a3a3a; color: #ccc; cursor: pointer; border-radius: 3px; font-size: 11px; }
  #toolbar button:hover { background: #505050; }
  #toolbar button:disabled { opacity: 0.38; cursor: not-allowed; }
  .btn-postman { border-color: #6b4c00 !important; color: #e8a130 !important; }
  .btn-postman:hover:not(:disabled) { background: #4a3300 !important; }
  #btnPreserve { border-color: #555; color: #888; }
  #btnPreserve.active { border-color: #c00 !important; color: #f88 !important; background: #2a1010 !important; }
  #btnPreserve.active:hover { background: #3a1818 !important; }
  #filter { flex: 1; min-width: 120px; padding: 3px 6px; background: #2d2d2d; border: 1px solid #555; color: #ccc; border-radius: 3px; }
  #count { color: #888; font-size: 11px; margin-left: auto; }

  /* Domain multiselect dropdown */
  #domainFilterWrap { position: relative; }
  #domainFilterBtn { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid #555; background: #3a3a3a; color: #ccc; cursor: pointer; border-radius: 3px; font-size: 11px; white-space: nowrap; }
  #domainFilterBtn:hover { background: #505050; }
  #domainFilterBtn .badge-count { background: #0e7fd4; color: #fff; border-radius: 8px; padding: 0 5px; font-size: 10px; }
  #domainDropdown { display: none; position: absolute; top: calc(100% + 4px); right: 0; z-index: 100; background: #252526; border: 1px solid #555; border-radius: 4px; min-width: 220px; max-height: 260px; overflow-y: auto; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  #domainDropdown.open { display: block; }
  .domain-option { display: flex; align-items: center; gap: 7px; padding: 5px 10px; cursor: pointer; font-size: 11px; color: #ccc; }
  .domain-option:hover { background: #2a2a2a; }
  .domain-option input[type=checkbox] { accent-color: #0e7fd4; cursor: pointer; }
  #domainDropdown .dd-actions { display: flex; gap: 6px; padding: 5px 10px; border-top: 1px solid #3c3c3c; }
  #domainDropdown .dd-actions button { flex: 1; padding: 3px 0; font-size: 10px; border: 1px solid #555; background: #3a3a3a; color: #bbb; border-radius: 3px; cursor: pointer; }
  #domainDropdown .dd-actions button:hover { background: #505050; }

  #main { display: flex; flex: 1; overflow: hidden; }

  /* Request list */
  #list { width: 45%; border-right: 1px solid #3c3c3c; overflow-y: auto; flex-shrink: 0; }
  .row { display: grid; grid-template-columns: 45px 50px 1fr 110px 110px 45px; gap: 4px; padding: 4px 8px; border-bottom: 1px solid #2a2a2a; cursor: pointer; align-items: center; white-space: nowrap; overflow: hidden; }
  .page-cell { overflow: hidden; text-overflow: ellipsis; color: #9cdcfe; font-size: 10px; }
  .domain-cell { overflow: hidden; text-overflow: ellipsis; color: #c586c0; font-size: 10px; }
  .row:hover { background: #2a2a2a; }
  .row.selected { background: #094771; }
  .row .badge { font-size: 10px; padding: 1px 4px; border-radius: 2px; text-align: center; font-weight: bold; }
  .badge.XHR  { background: #7c3e00; color: #ffa500; }
  .badge.Fetch{ background: #004d40; color: #4db6ac; }
  .method { font-weight: bold; color: #569cd6; }
  .url-cell { overflow: hidden; text-overflow: ellipsis; color: #ce9178; }
  .status-ok  { color: #4ec9b0; }
  .status-err { color: #f44747; }
  .status-red { color: #f44747; }
  .header-row { background: #2d2d2d; font-weight: bold; color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; cursor: default; position: sticky; top: 0; z-index: 1; }
  .header-row:hover { background: #2d2d2d; }

  /* Detail pane */
  #detail { flex: 1; overflow-y: auto; padding: 12px; }
  #detail .placeholder { color: #555; padding: 20px; }
  .section-title { color: #9cdcfe; font-weight: bold; margin: 12px 0 4px; text-transform: uppercase; font-size: 10px; letter-spacing: .8px; }
  .meta-grid { display: grid; grid-template-columns: 120px 1fr; gap: 2px 8px; margin-bottom: 8px; }
  .meta-key { color: #888; word-break: break-all; }
  details.headers > summary { cursor: pointer; }
  details.headers .placeholder { color: #555; padding: 0 0 4px 14px; }
  .meta-val { color: #ce9178; word-break: break-all; }
  pre { background: #252526; border: 1px solid #3c3c3c; padding: 8px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; color: #d4d4d4; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="btnClear">🗑 Clear</button>
  <button id="btnPreserve" title="Preserve Log: OFF — logs clear on navigation">⏺ Preserve Log</button>
  <button id="btnExportJSON">⬇ Export JSON</button>
  <button id="btnExportCSV">⬇ Export CSV</button>
  <button id="btnPostmanAll" class="btn-postman">📤 Postman (all)</button>
  <button id="btnPostmanSelected" class="btn-postman" disabled>📤 Postman (selected)</button>
  <input id="filter" type="text" placeholder="Filter by URL…" />
  <div id="domainFilterWrap">
    <button id="domainFilterBtn">🌐 Domains <span class="badge-count" id="domainBadge" style="display:none">0</span></button>
    <div id="domainDropdown">
      <div id="domainList"></div>
      <div class="dd-actions">
        <button id="ddSelectAll">Select all</button>
        <button id="ddClearAll">Clear all</button>
      </div>
    </div>
  </div>
  <span id="count">0 requests</span>
</div>
<div id="main">
  <div id="list">
    <div class="row header-row">
      <span>Type</span><span>Method</span><span>URL</span><span>Page</span><span>Domain</span><span>Status</span>
    </div>
  </div>
  <div id="detail"><p class="placeholder">← Select a request to inspect</p></div>
</div>
<script src="panel.js"></script>
</body>
</html>
