<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XHR Capture</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; width: 260px; margin: 0; padding: 14px 16px; background: #1e1e1e; color: #d4d4d4; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  ol { margin: 0; padding-left: 18px; line-height: 1.6; }
  kbd { background: #3a3a3a; border: 1px solid #555; border-radius: 3px; padding: 0 4px; font-size: 11px; }
  p { color: #888; font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>
  <h1>XHR Capture</h1>
  <ol>
    <li>Open DevTools (<kbd>F12</kbd> or <kbd>⌘ ⌥ I</kbd>).</li>
    <li>Open the <b>XHR Capture</b> tab (it may be under <b>»</b>).</li>
    <li>Use the page. XHR and fetch calls appear as they finish.</li>
  </ol>
  <p>Requests are captured only while DevTools is open. Nothing leaves your browser.</p>
</body>
</html>
